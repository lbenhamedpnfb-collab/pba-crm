<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PBA CRM — Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a0a2e 0%,#2d1b4e 50%,#1a0a2e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:40px;width:380px;box-shadow:0 32px 80px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:40px;margin-bottom:8px}
.logo-name{font-size:24px;font-weight:900;color:#fff;letter-spacing:-0.5px}
.logo-group{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.logo-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:6px}
label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;outline:none;transition:.2s;margin-bottom:16px}
input:focus{border-color:#C2185B;background:rgba(194,24,91,.08)}
button{width:100%;background:linear-gradient(135deg,#C2185B,#9B2D8E);color:#fff;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;transition:.2s;margin-top:4px;letter-spacing:.3px}
button:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 8px 24px rgba(194,24,91,.4)}
.err{background:rgba(194,24,91,.15);border:1px solid rgba(194,24,91,.4);border-radius:8px;padding:10px 14px;color:#f48fb1;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">💄</div>
    <div class="logo-name">PBA CRM</div>
    <div class="logo-group">Groupe DEFIS</div>
    <div class="logo-sub">Beauté & Esthétique — POEI & Alternance</div>
  </div>
  <div class="err" id="err">Identifiants incorrects</div>
  <label>Identifiant</label>
  <input type="text" id="u" placeholder="admin" autocomplete="username">
  <label>Mot de passe</label>
  <input type="password" id="p" placeholder="••••••••" autocomplete="current-password">
  <button onclick="login()">Se connecter →</button>
</div>
<script>
document.addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
async function login(){
  const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
  if(r.ok) window.location='/';
  else document.getElementById('err').style.display='block';
}
</script>
</body>
</html>
